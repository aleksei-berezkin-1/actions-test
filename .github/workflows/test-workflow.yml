name: Test Workflow

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-that-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - if: failure()
        run: echo 'test-that-fails job indeed failed'
  test-that-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test -- --pleasePass
  summary-job:
    needs: [test-that-fails, test-that-passes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test-that-fails: ${{ needs.test-that-fails.result }}"
          echo "test-that-passes: ${{ needs.test-that-passes.result }}"
